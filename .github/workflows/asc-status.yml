# App Store Connect に送ったビルドの処理状況を表示する(手動実行)
name: TestFlight status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Show builds
        run: |
          pip install --quiet pyjwt cryptography requests
          python - <<'EOF'
          import os, re, time, jwt, requests
          raw = os.environ["ASC_KEY_P8"].replace("\r", "")
          body = re.sub(r"-----[A-Z ]*-----", "", raw)
          body = re.sub(r"\s", "", body)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             pem, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          h = {"Authorization": "Bearer " + token}
          r = requests.get("https://api.appstoreconnect.apple.com/v1/builds",
                           params={"sort": "-uploadedDate", "limit": 5, "include": "preReleaseVersion,buildBetaDetail"}, headers=h)
          r.raise_for_status()
          data = r.json()
          beta = {i["id"]: i["attributes"] for i in data.get("included", []) if i["type"] == "buildBetaDetails"}
          for b in data["data"]:
              a = b["attributes"]
              bd = beta.get(b["relationships"]["buildBetaDetail"]["data"]["id"], {}) if b["relationships"].get("buildBetaDetail", {}).get("data") else {}
              print(f'build {a["version"]}: processing={a["processingState"]} uploaded={a["uploadedDate"]} '
                    f'expired={a.get("expired")} internal={bd.get("internalBuildState")} encryption={a.get("usesNonExemptEncryption")}')
          EOF
