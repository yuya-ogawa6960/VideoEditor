# main ブランチに push するたびに、署名したアプリを作って TestFlight に送ります。
# 必要な Secrets(リポジトリの Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID    … Apple Developer のチーム ID(10 文字)
#   ASC_KEY_ID       … App Store Connect API キーのキー ID
#   ASC_ISSUER_ID    … App Store Connect API キーの Issuer ID
#   ASC_KEY_P8       … ダウンロードした AuthKey_XXXX.p8 の中身(-----BEGIN PRIVATE KEY----- から最後まで)
# Secrets がまだないときは、何もせずに終わります。
name: TestFlight

on:
  push:
    branches: [ main ]
    # サーバー(server/)だけの変更ではアプリを作り直さない
    paths-ignore: [ "server/**", ".github/workflows/deploy-server.yml" ]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15-intel
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # App Store Connect はビルド番号が増え続ける必要があるため、AltStore 用の番号と重ならないよう 1000 から始める
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "Secrets が未設定のため TestFlight への送信をスキップします。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Select newest Xcode
        if: steps.check.outputs.ready == 'true'
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Generate Xcode project
        if: steps.check.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Write API key
        if: steps.check.outputs.ready == 'true'
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          # 貼り付け方の違い(Windows の改行、見出し行の有無、1 行につながった本文)を吸収して PEM に整える
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$KEY_PATH"
          echo "key body length: ${#BODY}"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "BUILD_NO=$((BUILD_NUMBER + 1000))" >> "$GITHUB_ENV"

      # 開発用証明書は実行ごとに秘密鍵が失われ 2 回目以降に失敗するため、アーカイブは署名なしで作り、
      # 書き出し(-exportArchive)のときに Apple のクラウド署名(配布用証明書)で署名する
      - name: Archive (unsigned; signed by Apple cloud signing at export)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VideoEditor.xcodeproj \
            -scheme VideoEditor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VideoEditor.xcarchive \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NO"

      - name: Embed entitlements (Sign in with Apple)
        if: steps.check.outputs.ready == 'true'
        run: |
          # アーカイブは署名なしで作るので、書き出し(クラウド署名)が権限を引き継げるよう、
          # アプリに権限(entitlements)だけを付けた仮の署名をしておく
          APP=$(find build/VideoEditor.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          # 中のフレームワーク(AdMob など配布済みのもの)も先に仮の署名にそろえる。
          # 配布元の署名が残ったままだと、書き出しの検証で「正しく署名されていない」と弾かれる
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 |
              while IFS= read -r -d '' FW; do
                echo "re-sign: $FW"
                codesign --force --sign - --timestamp=none "$FW"
              done
          fi
          codesign --force --sign - --entitlements VideoEditor.entitlements --timestamp=none "$APP"
          codesign -d --entitlements - "$APP" || true

      - name: Upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/VideoEditor.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
