# TestFlight で共有されたクラッシュ(フィードバック)を App Store Connect から取ってきて表示する(手動実行)
name: TestFlight crashes

on:
  workflow_dispatch:

jobs:
  crashes:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Show crash submissions
        run: |
          pip install --quiet pyjwt cryptography requests
          python - <<'EOF'
          import os, re, time, jwt, requests
          raw = os.environ["ASC_KEY_P8"].replace("\r", "")
          body = re.sub(r"-----[A-Z ]*-----", "", raw)
          body = re.sub(r"\s", "", body)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
                             pem, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          h = {"Authorization": "Bearer " + token}
          api = "https://api.appstoreconnect.apple.com"
          apps = requests.get(api + "/v1/apps", params={"filter[bundleId]": "com.yuyaogawa6960.videomania"}, headers=h)
          apps.raise_for_status()
          app_id = apps.json()["data"][0]["id"]
          r = requests.get(api + f"/v1/apps/{app_id}/betaFeedbackCrashSubmissions",
                           params={"limit": 5, "sort": "-createdDate"}, headers=h)
          print("crash submissions:", r.status_code)
          if r.status_code != 200:
              print(r.text[:2000])
              raise SystemExit(0)
          items = r.json().get("data", [])
          if not items:
              print("共有されたクラッシュはありません")
          for item in items:
              a = item["attributes"]
              print("=" * 80)
              print(a.get("createdDate"), a.get("deviceModel"), a.get("osVersion"), "build", a.get("buildBundleId"), a.get("appPlatform"))
              print("comment:", a.get("comment"))
              log = requests.get(api + f"/v1/betaFeedbackCrashSubmissions/{item['id']}/crashLog", headers=h)
              if log.status_code == 200:
                  text = log.json().get("data", {}).get("attributes", {}).get("logText") or ""
                  print(text[:12000])
              else:
                  print("crash log:", log.status_code, log.text[:500])
          EOF
