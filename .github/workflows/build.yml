# main ブランチに push するたびに、署名なしの IPA を作って Artifacts に置きます。
# 公開リポジトリなら macOS ランナーも無料です。
name: Build iOS app (unsigned IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project VideoEditor.xcodeproj \
            -scheme VideoEditor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr VideoEditor.ipa Payload
          ls -la VideoEditor.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-ipa
          path: VideoEditor.ipa
          retention-days: 30
