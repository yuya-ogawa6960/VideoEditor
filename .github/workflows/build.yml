# main ブランチに push するたびに、署名なしの IPA を作って Artifacts に置きます。
# 公開リポジトリなら macOS ランナーも無料です。
name: Build iOS app (unsigned IPA)

# TestFlight 配布に切り替えたため、AltStore 用の署名なし IPA は手動実行のときだけ作る
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # iPhone Duo に対応するため iOS 27.1 SDK(Xcode 27.1)で作る。Xcode 27 のイメージは Apple Silicon だけ
    # (以前は Apple Silicon ランナーが混雑して取れないことが続き、Intel ランナーで作っていた)。
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: deriveddata-${{ matrix.os }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ matrix.os }}-${{ hashFiles('project.yml') }}-
            deriveddata-${{ matrix.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      # このビルドには TikTok のクライアントキーを入れないので、空の URL スキームを入れないよう印のあいだを消す
      - name: Leave out the TikTok URL scheme
        run: sed -i '' -e '/# >>> tiktok-url-scheme/,/# <<< tiktok-url-scheme/d' project.yml

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project VideoEditor.xcodeproj \
            -scheme VideoEditor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App bundle: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr VideoEditor.ipa Payload
          ls -la VideoEditor.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-ipa-${{ matrix.os }}
          path: VideoEditor.ipa
          retention-days: 30
