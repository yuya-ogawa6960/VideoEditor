# ポイント・AI 中継サーバー(server/)を Cloudflare Workers にデプロイする。
# 必要な Secrets(リポジトリの Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   … Cloudflare の API トークン(「Workers を編集」+ D1 の編集権限)
#   CLOUDFLARE_ACCOUNT_ID  … Cloudflare のアカウント ID
#   OPENAI_API_KEY         … サーバーが使う OpenAI のキー
#   GOOGLE_TTS_API_KEY     … Google の読み上げ(Text-to-Speech API)のキー。なければ Google の声は使えない
#   TEST_AD_USERS          … TestFlight でテスト広告のポイントを受け取れるアカウント ID(カンマ区切り。なくてもよい)
# セッションの署名用の秘密(SESSION_SECRET)は、まだなければここで作ってサーバーに保存する。
name: Deploy server

on:
  push:
    branches: [ main ]
    paths: [ "server/**", ".github/workflows/deploy-server.yml" ]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      TEST_AD_USERS: ${{ secrets.TEST_AD_USERS }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "Secrets が未設定のためデプロイをスキップします。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up pasted values
        if: steps.check.outputs.ready == 'true'
        run: |
          # 貼り付けたときに入った改行や空白を取り除く
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          # 画面の「Test this token」の curl の文ごと貼った場合は、その中のトークンだけを取り出す
          EXTRACTED=$(printf '%s' "$TOKEN" | grep -o 'cfut_[A-Za-z0-9_-]*' | head -n 1 || true)
          if [ -n "$EXTRACTED" ]; then TOKEN="$EXTRACTED"; fi
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          OPENAI=$(printf '%s' "$OPENAI_API_KEY" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          # トークンの形だけ確かめる(値は出さない)
          case "$TOKEN" in cfut_*) PREFIX=yes ;; *) PREFIX=no ;; esac
          if printf '%s' "$TOKEN" | LC_ALL=C grep -q '[^A-Za-z0-9_-]'; then ODD=yes; else ODD=no; fi
          echo "token length: ${#TOKEN} / starts with cfut_: $PREFIX / other characters: $ODD"
          # トークンが有効か(値は出さず、結果だけ表示)
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log("token verify:",j.success,j.result&&j.result.status,JSON.stringify(j.errors))}catch(e){console.log("token verify: unreadable")}})'
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log("accounts:",j.success,(j.result||[]).length,JSON.stringify(j.errors))}catch(e){console.log("accounts: unreadable")}})'
          # アカウント ID はトークンから取り出せればそちらを使う(貼り付けた ID が途中で切れていても動くように)
          FOUND=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).result||[];process.stdout.write(r.length?r[0].id:"")}catch(e){}})')
          if [ -n "$FOUND" ]; then
            if [ "$FOUND" != "$ACCOUNT" ]; then echo "登録されたアカウント ID と違うため、トークンから取り出した ID を使います(長さ: ${#ACCOUNT} → ${#FOUND})"; fi
            ACCOUNT="$FOUND"
          fi
          echo "::add-mask::$ACCOUNT"
          echo "::add-mask::$OPENAI"
          {
            echo "CLOUDFLARE_API_TOKEN=$TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT"
            echo "OPENAI_API_KEY=$OPENAI"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: Create D1 database (first time only) and set its ID
        if: steps.check.outputs.ready == 'true'
        run: |
          npm install --no-save --silent wrangler@4
          ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="videomania");process.stdout.write(d?d.uuid:"")')
          if [ -z "$ID" ]; then
            npx wrangler d1 create videomania
            ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="videomania");process.stdout.write(d?d.uuid:"")')
          fi
          test -n "$ID"
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute videomania --remote --file=schema.sql --yes

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Set secrets
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          if ! npx wrangler secret list | grep -q SESSION_SECRET; then
            openssl rand -hex 32 | tr -d '\n' | npx wrangler secret put SESSION_SECRET
          fi
          # Google の読み上げのキー。GitHub の secret GOOGLE_TTS_API_KEY を設定したときだけ(貼り付けた空白・改行は除く)
          if [ -n "$GOOGLE_TTS_API_KEY" ]; then
            GOOGLE=$(printf '%s' "$GOOGLE_TTS_API_KEY" | tr -d '[:space:]')
            echo "::add-mask::$GOOGLE"
            printf '%s' "$GOOGLE" | npx wrangler secret put GOOGLE_TTS_API_KEY
          fi
          # 利用状況ページ(/stats?token=…)の合言葉。GitHub の secret STATS_TOKEN を設定したときだけ
          if [ -n "$STATS_TOKEN" ]; then
            printf '%s' "$STATS_TOKEN" | tr -d '\r\n' | npx wrangler secret put STATS_TOKEN
          fi
          # TestFlight でテスト広告のポイントを受け取れるアカウント(アプリの 設定 → サポート用の情報 → アカウント ID)。
          # 設定しないと、テスト版でも広告のポイントは付かない(本番の広告は SSV で付く)
          if [ -n "$TEST_AD_USERS" ]; then
            printf '%s' "$TEST_AD_USERS" | tr -d '[:space:]' | npx wrangler secret put TEST_AD_USERS
          fi

      - name: Show URL
        if: steps.check.outputs.ready == 'true'
        run: grep -o 'https://[a-zA-Z0-9.-]*workers.dev' deploy.log | head -n 1
