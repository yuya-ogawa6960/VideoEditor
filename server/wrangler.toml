# Video Mania のポイント・AI 中継サーバー(Cloudflare Workers)
# デプロイは .github/workflows/deploy-server.yml が行う(database_id もそこで埋める)
name = "videomania-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# アプリのバンドル ID(Apple でサインインのトークンの宛先チェック)
APPLE_AUDIENCE = "com.yuyaogawa6960.videomania"
# リワード広告: "1" ならすべてのアプリの申告(/v1/ads/claim)でポイントを足す。
# "0"(本番)では、AdMob のサーバー側検証(/v1/ads/ssv)で足し、申告で足すのは TestFlight(x-vm-test-build: 1)だけ
ALLOW_CLIENT_AD_CLAIM = "0"

[[d1_databases]]
binding = "DB"
database_name = "videomania"
database_id = "__D1_DATABASE_ID__"
