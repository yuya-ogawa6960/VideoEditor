# XcodeGen 用のプロジェクト定義。
# GitHub Actions 上で `xcodegen generate` すると VideoEditor.xcodeproj が生成されます。
name: VideoEditor
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # 開発言語は日本語。翻訳は Sources/Resources/Localizable.xcstrings(英語・スペイン語・ポルトガル語)
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "5.0"
    # アプリと共有用の拡張機能で同じ番号にする(App Store の決まり)。上げるときはここだけ
    MARKETING_VERSION: "1.12.52"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

# Swift パッケージ(WhisperKit: 端末内 Whisper 音声認識)。
# WhisperKit を外したいときは、この packages と targets.VideoEditor.dependencies を削除するだけでよい
# (Sources 側は `#if canImport(WhisperKit)` で守られているので Swift の変更は不要。Whisper エンジンは「利用不可」になる)。
packages:
  # 広告(AdMob)。Sources/Engine/AdsManager.swift
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  # 広告の同意(ヨーロッパなどで必要な同意画面)
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0

targets:
  VideoEditor:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      # 共有用の拡張機能と共通(App Group の置き場所)
      - path: Shared
    dependencies:
      # >>> share-extension(リポジトリ変数 SHARE_EXTENSION が on でないとき、CI はこの印のあいだを消す)
      # 「共有」から Video Mania に送る拡張機能(ShareExtension/)
      - target: ShareExtension
      # <<< share-extension
      - package: WhisperKit
        product: WhisperKit
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
    entitlements:
      path: VideoEditor.entitlements
      properties:
        # Apple でサインイン(ポイントのアカウント)
        com.apple.developer.applesignin:
          - Default
        # >>> share-extension
        # 共有用の拡張機能が受け取った動画・写真を置く共有フォルダ(Shared/AppGroup.swift)
        com.apple.security.application-groups:
          - group.com.yuyaogawa6960.videomania
        # <<< share-extension
    info:
      path: Info.plist
      properties:
        # ポイント・AI 中継サーバー(server/。空ならポイントの機能は「準備中」)
        VMServerURL: "$(VM_SERVER_URL)"
        # Google フォトから直接取り込む(Google Photos Picker API)の OAuth クライアント ID
        GoogleOAuthClientID: "$(GOOGLE_OAUTH_CLIENT_ID)"
        CFBundleDisplayName: Video Mania
        CFBundleName: VideoEditor
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations:
          - ja
          - en
          - es
          - pt-BR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: 編集する動画を選ぶために写真ライブラリを使用します。
        NSPhotoLibraryAddUsageDescription: 書き出した動画を保存するために写真ライブラリを使用します。
        NSSpeechRecognitionUsageDescription: 動画の音声から字幕を自動作成するために音声認識を使用します。
        NSMicrophoneUsageDescription: ナレーションを録音するためにマイクを使用します。
        # 広告(AdMob)
        GADApplicationIdentifier: ca-app-pub-5816286661245536~3399107309
        NSUserTrackingUsageDescription: あなたに合った広告を表示するために使用します。許可しなくてもアプリはすべて使えます。
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: pwa73g5rt2.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        UIBackgroundModes:
          - processing
        # 継続処理(BGContinuedProcessingTask)の識別子は実行時のバンドル ID から作る("<bundleID>.export.<UUID>" など)。
        # 1.6 からバンドル ID は com.yuyaogawa6960.videomania(TestFlight 配布用)。以下の com.personal.* は AltStore 時代の名残。
        # AltStore はバンドル ID を "com.personal.videoeditor.<TEAMID>" に書き換えるが、この一覧は書き換えないため、
        # ワイルドカード "com.personal.videoeditor.*" で書き換え後の ID にも一致させる。先頭の固定 ID は以前のバージョン用。
        BGTaskSchedulerPermittedIdentifiers:
          - "com.yuyaogawa6960.videomania.*"
          - com.personal.videoeditor.export
          - "com.personal.videoeditor.*"
          - "com.personal.videoeditor.export.*"
          - "com.personal.videoeditor.transcribe.*"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # プロジェクトのパッケージ(<名前>.videomania、ProjectPackage)。「ファイル」アプリでフォルダではなく
        # 1 つの書類として表示され、タップすると Video Mania で開ける(RootView の onOpenURL → 一覧で読み込み)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.yuyaogawa6960.videomania.project
            UTTypeDescription: Video Mania Project
            UTTypeConformsTo:
              - com.apple.package
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - videomania
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video Mania Project
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.yuyaogawa6960.videomania.project
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuyaogawa6960.videomania
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        VM_SERVER_URL: "https://videomania-api.yuya-ogawa0906.workers.dev"
        # Google フォトから直接取り込むときの OAuth クライアント ID(iOS 用。docs/GooglePhotosSetup.md)。
        # 空のあいだは、追加の選択肢に「Google フォト」を出さない
        GOOGLE_OAUTH_CLIENT_ID: ""

  # >>> share-extension
  # 写真アプリ・Google フォトなどの「共有」から、動画・写真を Video Mania に送る拡張機能。
  # 受け取ったファイルは App Group の Inbox に置き、アプリを開いたときに取り込む(Sources/Model/IncomingMedia.swift)。
  # App Group と拡張機能の App ID を Apple Developer に登録するまでは、CI がこの印のあいだを消して作る
  # (docs/AppStoreSubmission.md の「共有の拡張機能」。登録したらリポジトリ変数 SHARE_EXTENSION を on にする)
  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ShareExtension
      - path: Shared
    entitlements:
      path: ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yuyaogawa6960.videomania
    info:
      path: ShareExtension-Info.plist
      properties:
        CFBundleDisplayName: Video Mania
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations:
          - ja
          - en
          - es
          - pt-BR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuyaogawa6960.videomania.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        # アーカイブには埋め込んだアプリ(Products/Applications/VideoEditor.app)だけを入れる。
        # NO のままだと .appex がアーカイブの Products 直下にも入り、書き出しできない「汎用アーカイブ」になる
        SKIP_INSTALL: "YES"
  # <<< share-extension

schemes:
  VideoEditor:
    build:
      targets:
        VideoEditor: all
    run:
      config: Debug
    archive:
      config: Release
