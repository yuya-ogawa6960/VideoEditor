# XcodeGen 用のプロジェクト定義。
# GitHub Actions 上で `xcodegen generate` すると VideoEditor.xcodeproj が生成されます。
name: VideoEditor
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

# Swift パッケージ(WhisperKit: 端末内 Whisper 音声認識)。
# WhisperKit を外したいときは、この packages と targets.VideoEditor.dependencies を削除するだけでよい
# (Sources 側は `#if canImport(WhisperKit)` で守られているので Swift の変更は不要。Whisper エンジンは「利用不可」になる)。
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0

targets:
  VideoEditor:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Video Mania
        CFBundleName: VideoEditor
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 編集する動画を選ぶために写真ライブラリを使用します。
        NSPhotoLibraryAddUsageDescription: 書き出した動画を保存するために写真ライブラリを使用します。
        NSSpeechRecognitionUsageDescription: 動画の音声から字幕を自動作成するために音声認識を使用します。
        NSMicrophoneUsageDescription: ナレーションを録音するためにマイクを使用します。
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.personal.videoeditor.export
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.videoeditor
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  VideoEditor:
    build:
      targets:
        VideoEditor: all
    run:
      config: Debug
    archive:
      config: Release
